name: One-time A4 official source audit

on:
  push:
    branches:
      - feature/a4-live-sec-audit-run
    paths:
      - .github/workflows/sec-live-audit-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a4-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline regressions
        run: python -m pytest -q
      - name: Declare SEC user agent with public repository commit contact
        shell: bash
        run: |
          email="$(git log -1 --format=%ae)"
          if [[ "$email" != *"@"* ]]; then
            echo "No public commit email for SEC identifying User-Agent"
            exit 2
          fi
          echo "SEC_USER_AGENT=LabyrinthMomentumUSV2 SourceAudit $email" >> "$GITHUB_ENV"
      - name: Capture Nasdaq and NYSE exchange directories
        run: python -m src.data.universe.capture --output runtime/a4/nasdaq-capture
      - name: Reconstruct directory-only provisional universe
        run: |
          python -m src.data.universe.review \
            --raw-dir runtime/a4/nasdaq-capture \
            --output runtime/a4/directory-review
      - name: Capture SEC company-exchange map
        run: python -m src.data.universe.sec_capture --output runtime/a4/sec-capture
      - name: Offline reconcile validated SEC and directory captures
        run: |
          python -m src.data.universe.sec_review \
            --sec-capture runtime/a4/sec-capture/capture.json \
            --review-json runtime/a4/directory-review/review.json \
            --output runtime/a4/sec-review
      - name: Audit SHA-identical A1 baseline and match matrix
        run: |
          python -m src.data.universe.audit_summary \
            --directory-review runtime/a4/directory-review/review.json \
            --sec-review runtime/a4/sec-review/sec-review.json \
            --a1-baseline docs/audits/universe-2026-10-14.json \
            --output runtime/a4/final-audit.json
      - name: Preserve raw official snapshots and audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a4-sec-directory-audit
          path: runtime/a4/
          if-no-files-found: warn
          retention-days: 30

# A4 one-time recheck after independent baseline fixture correction
