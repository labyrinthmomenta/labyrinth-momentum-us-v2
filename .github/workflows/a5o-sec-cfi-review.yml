name: A5o SEC 21 independent type conflicts
on:
  push:
    branches: [feature/a5o-critical-21-sec-type-evidence]
    paths: [.github/workflows/a5o-sec-cfi-review.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: a4-sec-directory-audit
          run-id: 38629237276
          repository: labyrinthmomenta/labyrinth-momentum-us-v2
          github-token: ${{ github.token }}
          path: runtime/a4
      - name: Set accountable SEC fair-access contact
        shell: bash
        run: |
          email="$(git log -1 --format=%ae)"
          [[ "$email" == *"@"* ]] || exit 2
          echo "SEC_USER_AGENT=LabyrinthMomentumUSV2 A5o-FilingReview $email" >> "$GITHUB_ENV"
      - name: Fetch 21 exact SEC issuer submissions, preserve SHA and review holds
        run: |
          python -m src.data.universe.a5o_sec_cfi_exceptions \
            --a4 runtime/a4 \
            --output runtime/a5o
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5o-sec-21-issuer-cfi-audit
          path: runtime/a5o/
          if-no-files-found: warn
          retention-days: 90
