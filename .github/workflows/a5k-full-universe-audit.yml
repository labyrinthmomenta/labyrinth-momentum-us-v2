name: One-time A5k full-universe security-class evidence audit
on:
  push:
    branches:
      - feature/a5k-full-universe-official-type-audit
    paths:
      - .github/workflows/a5k-full-universe-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all tests before any SEC network calls
        run: python -m pytest -q
      - name: Restore 14 Oct original official Nasdaq and SEC directory artifacts
        uses: actions/download-artifact@v4
        with:
          name: a4-sec-directory-audit
          run-id: 38629237276
          repository: labyrinthmomenta/labyrinth-momentum-us-v2
          github-token: ${{ github.token }}
          path: runtime/a4
      - name: Restore SHA-pinned A5j 1010-row classification evidence and gate
        uses: actions/download-artifact@v4
        with:
          name: a5j-type-triage-release-deny-simulation
          run-id: 38743416303
          repository: labyrinthmomenta/labyrinth-momentum-us-v2
          github-token: ${{ github.token }}
          path: runtime/a5j
      - name: Reparse official Nasdaq and SEC bytes and evaluate ALL 13287 listings
        run: |
          python -m src.data.universe.a5k_full_release \
            --a4 runtime/a4 \
            --a5j runtime/a5j \
            --output runtime/a5k-gate
      - name: Preserve full 13287-listing source-deny gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5k-official-full-universe-deny
          path: runtime/a5k-gate/
          if-no-files-found: warn
          retention-days: 90
      - name: Set accountable SEC fair-access research contact
        shell: bash
        run: |
          email="$(git log -1 --format=%ae)"
          if [[ "$email" != *"@"* ]]; then
            echo 'SEC contact required'; exit 2
          fi
          echo "SEC_USER_AGENT=LabyrinthMomentumUSV2 A5k-SecurityTypeAudit $email" >> "$GITHUB_ENV"
      - name: Fetch nine pilot SEC issuer filings for class and type evidence
        id: sec_pilot
        continue-on-error: true
        run: |
          python -m src.data.universe.a5k_sec_type_pilot \
            --a5j runtime/a5j \
            --output runtime/a5k-sec
      - name: Make missing SEC pilot filings an explicit not-approved result
        if: always()
        shell: bash
        run: |
          if [[ -f runtime/a5k-sec/a5k-sec-pilot-evidence.json ]]; then
            python -c 'import json; d=json.load(open("runtime/a5k-sec/a5k-sec-pilot-evidence.json")); print("SEC pilot status:",d["status"],"documents:",d["official_primary_filings_verified"],"/",d["pilot_size"])'
          else
            echo 'SEC pilot artifact not created; all nine remain REVIEW_REQUIRED'
          fi
      - name: Preserve nine-pilot raw SEC source bytes and SHA-256 ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5k-9-issuer-sec-type-pilot
          path: runtime/a5k-sec/
          if-no-files-found: warn
          retention-days: 90
