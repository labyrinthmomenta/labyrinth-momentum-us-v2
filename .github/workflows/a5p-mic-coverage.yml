name: A5p dated ticker and XASE coverage review
on:
  push:
    branches: [feature/a5p-missing-symbol-mic-audit]
    paths: [.github/workflows/a5p-mic-coverage.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: a4-sec-directory-audit
          run-id: 38629237276
          repository: labyrinthmomenta/labyrinth-momentum-us-v2
          github-token: ${{ github.token }}
          path: runtime/a4
      - name: Verify seven TV-only, six official-only, 314 XASE exceptions
        run: |
          python -m src.data.universe.a5p_date_mic_gaps \
            --a4-review runtime/a4/directory-review/review.json \
            --output runtime/a5p
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5p-symbol-and-xase-exceptions
          path: runtime/a5p/
          if-no-files-found: warn
          retention-days: 90
